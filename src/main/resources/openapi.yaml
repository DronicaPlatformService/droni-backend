openapi: 3.1.0
servers:
    - description: localhost
      url: http://localhost:8080
info:
  title: droni-api
  description: |
    droni-api <br />
  termsOfService: https://swagger.io/terms/
  license:
    name: Apache License Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '0.0.1'
tags:
  - name: home
    description: home API
paths:
  /api/home/banner:
    get:
      tags:
        - home
      summary: get banner api
      description: get banner image for home page
      operationId: getBanner
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
        404:
          description: no banner images
        500:
          description: internal server error
components:
  schemas:
    File:
      title: file
      description: file object
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: fileName
        path:
          type: string
          example: http://filePathURL