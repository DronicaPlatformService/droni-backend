openapi: 3.1.0
servers:
  - description: localhost
    url: http://localhost:8080
  - description: dev(ncp)
    url: http://223.130.147.166:8080
info:
  title: droni-api
  description: |
    droni-api <br />
  termsOfService: https://swagger.io/terms/
  license:
    name: Apache License Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '0.0.4'
tags:
  - name: home
    description: home API
  - name: test
    description: test API
  - name: auth
    description: auth API
  - name: article
  - name: expert
    description: drone pilot API
security:
  - bearer-key: []
paths:
  /home/banner:
    get:
      tags:
        - home
      summary: get banner api
      description: get banner image for home page
      operationId: getBanner
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DroniFile'
  /home/popular-pilot:
    get:
      tags:
        - home
      summary: get popular pilot api
      description: get popular pilot user profile for home page
      operationId: getPopularPilot
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PilotProfile'
  /article/how-to-use/summary:
    get:
      tags:
        - article
      summary: 메인화면에서 보여지는 활용백서 5개 반환 api
      parameters:
        - in: query
          schema:
            type: string
            enum:
              - ALL
              - USER
              - EXPERT
          name: articleTarget
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleSummaryResponse'
  /article/drone-content/summary:
    get:
      tags:
        - article
      summary: 메인화면 드론 콘텐츠 5개 반환 api
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleSummaryResponse'
  /expert/popular:
    get:
      tags:
        - expert
      summary: 메인화면 인기 조종사 api
      responses:
        200:
          description: request success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopularExpert'
  /sucess-test:
    get:
      tags:
        - test
      description: authentication test api
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: string
  /expire-test:
    get:
      tags:
        - test
      description: token expired test api
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: string
  /reissue:
    post:
      tags:
        - auth
      description: token reissue api
      requestBody:
        description: dashboard 구성한 값을 전달한다.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshDto"
      responses:
        200:
          description: reissue expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshDto"

components:
  schemas:
    DroniFile:
      title: file
      description: file object
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: fileName
        path:
          type: string
          example: http://filePathURL
    PilotProfile:
      title: pilot profile
      description: pilot profile object
      type: object
      properties:
        expertId:
          type: integer
          format: int64
        nickName:
          type: string
          example: user nickname
        imageUrl:
          type: string
          example: http:/imageURL
    TokenRefreshDto:
      type: object
      description: request for refreshing token
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    ArticleSummaryResponse:
      type: object
      properties:
        articleImageUri:
          type: string
        articleSubject:
          type: string
    PopularExpert:
      type: object
      properties:
        expertId:
          type: integer
        score:
          type: number
          format: float
        profileImage:
          type: string


  securitySchemes:
    bearer-key:
      type: http
      scheme: bearer
      bearerFormat: JWT

