openapi: 3.1.0
servers:
  - description: localhost
    url: http://localhost:8080
  - description: dev(ncp)
    url: http://223.130.147.166:8080
info:
  title: droni-api
  description: |
    droni-api <br />
  termsOfService: https://swagger.io/terms/
  license:
    name: Apache License Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '0.0.6'
tags:
  - name: home
    description: home API
  - name: test
    description: test API
  - name: auth
    description: auth API
  - name: expert
    description: drone pilot API
  - name: chat
    description: droni chat API
security:
  - bearer-key: []
paths:
  /home/banner:
    get:
      tags:
        - home
      summary: get banner api
      description: get banner image for home page
      operationId: getBanner
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DroniFile'
  /home/popular-pilot:
    get:
      tags:
        - expert
      summary: 홈 화면 인기 조종사 api
      description: get popular pilot user profile for home page
      operationId: getPopularPilot
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PilotProfile'
  /sucess-test:
    get:
      tags:
        - test
      description: authentication test api
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: string
  /expire-test:
    get:
      tags:
        - test
      description: token expired test api
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: string
  /reissue:
    post:
      tags:
        - auth
      description: token reissue api
      requestBody:
        description: dashboard 구성한 값을 전달한다.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshDto"
      responses:
        200:
          description: reissue expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshDto"
  /chat/chatroom/{userId}:
    get:
      tags:
        - chat
      description: 유저의 채팅방 목록을 가져오는 api 생성
      parameters:
        - in: path
          required: true
          name: userId
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: 사용자의 채팅방 정상 반환
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserChatroom"

  /chat:
    post:
      tags:
        - chat
      description: 채팅방 생성 id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        200:
          description: 채팅방 정상 생성
          content:
            application/json:
              schema:
                type: integer
                format: int64
  /chat/history/{chatroomId}:
    get:
      tags:
        - chat
      description: 이전 message 목록을 가져오는 api
      parameters:
        - in: path
          required: true
          name: chatroomId
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: 이전 메세지 정상 반환
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'


components:
  schemas:
    DroniFile:
      title: file
      description: file object
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: fileName
        path:
          type: string
          example: http://filePathURL
    PilotProfile:
      title: pilot profile
      description: pilot profile object
      type: object
      properties:
        expertId:
          type: integer
          format: int64
        score:
          type: number
          format: float
        nickName:
          type: string
          example: user nickname
        imageUrl:
          type: string
          example: http:/imageURL
    TokenRefreshDto:
      type: object
      description: request for refreshing token
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    ChatMessage:
      type: object
      properties:
        messageId:
          type: integer
          format: int64
        chatroomId:
          type: integer
          format: int64
        repliedMessageId:
          type: integer
          format: int64
        content:
          type: string
        filePath:
          type: string
        timestamp:
          type: string
          format: date-times
    CreateChatRequest:
      type: object
      required: [fromUserId, toUserId]
      properties:
        fromUserId:
          type: integer
          format: int64
          example: 10
        toUserId:
          type: integer
          format: int64
          example: 20
    UserChatroom:
      type: object
      properties:
        expertId:
          type: integer
          format: int64
        expertName:
          type: string
        expertScore:
          type: number
          format: float
        expertAddr:
          type: string
        lastMessage:
          type: string
        lastTimestamp:
          type: string
  securitySchemes:
    bearer-key:
      type: http
      scheme: bearer
      bearerFormat: JWT

