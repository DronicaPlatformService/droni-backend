name: API CI/CD Deploy

on:
  push:
    branches:
      - develop

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3
      # Inject API secret
      - name: Inject API secret
        run: echo "${{ secrets.DRONI_API_SECRET_YAML }}" | base64 --decode > ./src/main/resources/application-auth.yaml

      # Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '21'

      # Build the project
      - name: Build Jar with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: build

      # Log in to Docker Hub
      - name: Log in Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Set up Docker BuildX
      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v2

      # Build and push multi-arch image
      - name: Build and push multi-arch image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/arm64 -t hc07car/droni:latest --push .

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
    # Set up kubectl
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Setup kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
        chmod 600 ~/.kube/config

    # Deploy to cluster
    - name: Rollout Update
      run: |
        kubectl -n droni-dev set image deployment/droni-api-deployment droni-api=hc07car/droni:latest




